name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      image_tag:
        description: Tested development image Git SHA. Required for production.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: brainlesschef
  GCP_REGION: us-east1
  IMAGE_REPOSITORY: us-east1-docker.pkg.dev/brainlesschef/brainless-chef

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'development' }}
      REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - id: image
        name: Select release image
        run: |
          if [[ "${DEPLOYMENT_ENVIRONMENT}" == "production" ]]; then
            if [[ ! "${REQUESTED_IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Production deployments require image_tag to be a full, tested Git SHA." >&2
              exit 1
            fi
            echo "tag=${REQUESTED_IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.image.outputs.tag }}
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build and publish development containers
        if: env.DEPLOYMENT_ENVIRONMENT == 'development'
        run: |
          docker build --file apps/api/Dockerfile --tag "${IMAGE_REPOSITORY}/development/api:${{ steps.image.outputs.tag }}" .
          docker build --file apps/web/Dockerfile --tag "${IMAGE_REPOSITORY}/development/web:${{ steps.image.outputs.tag }}" .
          docker push "${IMAGE_REPOSITORY}/development/api:${{ steps.image.outputs.tag }}"
          docker push "${IMAGE_REPOSITORY}/development/web:${{ steps.image.outputs.tag }}"
      - name: Promote tested development containers
        if: env.DEPLOYMENT_ENVIRONMENT == 'production'
        run: |
          if docker pull "${IMAGE_REPOSITORY}/production/api:${{ steps.image.outputs.tag }}" && docker pull "${IMAGE_REPOSITORY}/production/web:${{ steps.image.outputs.tag }}"; then
            echo "Using retained production images for this release."
          else
            docker pull "${IMAGE_REPOSITORY}/development/api:${{ steps.image.outputs.tag }}"
            docker pull "${IMAGE_REPOSITORY}/development/web:${{ steps.image.outputs.tag }}"
            docker tag "${IMAGE_REPOSITORY}/development/api:${{ steps.image.outputs.tag }}" "${IMAGE_REPOSITORY}/production/api:${{ steps.image.outputs.tag }}"
            docker tag "${IMAGE_REPOSITORY}/development/web:${{ steps.image.outputs.tag }}" "${IMAGE_REPOSITORY}/production/web:${{ steps.image.outputs.tag }}"
            docker push "${IMAGE_REPOSITORY}/production/api:${{ steps.image.outputs.tag }}"
            docker push "${IMAGE_REPOSITORY}/production/web:${{ steps.image.outputs.tag }}"
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Apply Terraform
        working-directory: infrastructure/environments/${{ inputs.environment || 'development' }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var="api_image=${IMAGE_REPOSITORY}/${DEPLOYMENT_ENVIRONMENT}/api:${{ steps.image.outputs.tag }}" \
            -var="web_image=${IMAGE_REPOSITORY}/${DEPLOYMENT_ENVIRONMENT}/web:${{ steps.image.outputs.tag }}"
