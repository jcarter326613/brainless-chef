name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      image_tag:
        description: Tested development migration and web image Git SHA. Required for production.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: brainlesschef
  GCP_REGION: us-east1

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.environment != 'production' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'development' }}
      REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - id: image
        name: Select release image
        run: |
          if [[ "${DEPLOYMENT_ENVIRONMENT}" == "production" ]]; then
            if [[ ! "${REQUESTED_IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Production deployments require image_tag to be a full Git SHA." >&2
              exit 1
            fi
            echo "tag=${REQUESTED_IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi
          echo "repository=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/brainless-chef-${DEPLOYMENT_ENVIRONMENT}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.image.outputs.tag }}
          fetch-depth: 0
      - name: Verify production release commit
        if: env.DEPLOYMENT_ENVIRONMENT == 'production'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ steps.image.outputs.tag }}" origin/main; then
            echo "Production image_tag must identify a commit reachable from main." >&2
            exit 1
          fi
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build and publish containers
        run: |
          build_if_missing() {
            component="$1"
            dockerfile="$2"
            image="$3"

            if gcloud artifacts docker images describe "${image}" --format='value(image_summary.digest)' >/dev/null 2>&1; then
              echo "Using existing content-addressed ${component} image."
              return
            fi

            docker build --file "${dockerfile}" --tag "${image}" .
            docker push "${image}"
          }

          build_if_missing api apps/api/Dockerfile "${{ steps.image.outputs.repository }}/api:${{ steps.image.outputs.tag }}"
          build_if_missing migration apps/migrate/Dockerfile "${{ steps.image.outputs.repository }}/migration:${{ steps.image.outputs.tag }}"
          build_if_missing web apps/web/Dockerfile "${{ steps.image.outputs.repository }}/web:${{ steps.image.outputs.tag }}"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Ensure Firestore database and secret containers exist
        working-directory: infrastructure/environments/${{ inputs.environment || 'development' }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -target=google_firestore_database.database \
            -target=module.cloud_run.google_secret_manager_secret.jwt \
            -target=module.cloud_run.google_secret_manager_secret.mailtrap
      - name: Seed application secrets
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'development' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
        run: |
          seed_secret() {
            secret_name="$1"
            secret_value="$2"
            if [[ -z "${secret_value}" ]]; then
              echo "No value configured for ${secret_name}; skipping." >&2
              return 0
            fi
            if gcloud secrets versions list "${secret_name}" \
              --project "${GCP_PROJECT_ID}" \
              --filter="state=ENABLED" \
              --format='value(name)' \
              --limit=1 | grep -q .; then
              echo "Secret ${secret_name} already has an enabled version; skipping."
              return 0
            fi
            printf '%s' "${secret_value}" | gcloud secrets versions add "${secret_name}" \
              --project "${GCP_PROJECT_ID}" \
              --data-file=-
            echo "Seeded ${secret_name}."
          }
          seed_secret "jwt-secret-${DEPLOYMENT_ENVIRONMENT}" "${JWT_SECRET}"
          seed_secret "mailtrap-api-token-${DEPLOYMENT_ENVIRONMENT}" "${MAILTRAP_API_TOKEN}"
      - name: Deploy database migrator service
        env:
          RELEASE_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        working-directory: infrastructure/environments/${{ inputs.environment || 'development' }}/migrate
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var="migration_image=${{ steps.image.outputs.repository }}/migration:${RELEASE_IMAGE_TAG}"
      - name: Run database migrations
        env:
          RELEASE_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          MIGRATION_SERVICE_ACCOUNT="brainless-${DEPLOYMENT_ENVIRONMENT}-migrator@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          MIGRATION_TASK="migrate-${DEPLOYMENT_ENVIRONMENT}-${RELEASE_IMAGE_TAG}"
          MIGRATION_QUEUE="brainless-chef-${DEPLOYMENT_ENVIRONMENT}-migrate"
          MIGRATION_SERVICE_URL="$(gcloud run services describe "brainless-chef-${DEPLOYMENT_ENVIRONMENT}-migrate" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(status.url)')"

          migrate_status() {
            curl -sS \
              -H "Authorization: Bearer $(gcloud auth print-access-token)" \
              "${MIGRATION_SERVICE_URL}/__migrate/status/${MIGRATION_TASK}" \
              | jq -r '.state // "missing"'
          }

          if [[ "$(migrate_status)" == "succeeded" ]]; then
            echo "${MIGRATION_TASK} already succeeded; skipping enqueue."
            exit 0
          fi

          if ! gcloud tasks create-http-task "${MIGRATION_TASK}" \
            --project "${GCP_PROJECT_ID}" \
            --location "${GCP_REGION}" \
            --queue "${MIGRATION_QUEUE}" \
            --url "${MIGRATION_SERVICE_URL}/__migrate" \
            --method POST \
            --header "Content-Type: application/json" \
            --body-content "{\"requestId\":\"${MIGRATION_TASK}\",\"imageTag\":\"${RELEASE_IMAGE_TAG}\"}" \
            --oidc-service-account-email "${MIGRATION_SERVICE_ACCOUNT}" \
            --oidc-token-audience "${MIGRATION_SERVICE_URL}" \
            --quiet; then
            if [[ "$(migrate_status)" == "missing" ]]; then
              echo "Failed to enqueue ${MIGRATION_TASK}." >&2
              exit 1
            fi
            echo "A migration for ${MIGRATION_TASK} is already running; waiting for it."
          fi

          for _ in $(seq 1 60); do
            case "$(migrate_status)" in
              succeeded)
                echo "Database migration succeeded: ${MIGRATION_TASK}"
                exit 0
                ;;
              failed)
                echo "Database migration failed: ${MIGRATION_TASK}" >&2
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for database migration: ${MIGRATION_TASK}" >&2
          exit 1
      - name: Apply Terraform
        working-directory: infrastructure/environments/${{ inputs.environment || 'development' }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var="web_image=${{ steps.image.outputs.repository }}/web:${{ steps.image.outputs.tag }}" \
            -var="api_image=${{ steps.image.outputs.repository }}/api:${{ steps.image.outputs.tag }}"
      - name: Print deployed website URL
        working-directory: infrastructure/environments/${{ inputs.environment || 'development' }}
        run: |
          if [[ "${DEPLOYMENT_ENVIRONMENT}" == "production" ]]; then
            website_url="$(terraform output -raw website_domain_url)"
          else
            website_url="$(terraform output -raw web_url)"
          fi
          echo "Deployed website: ${website_url}"
