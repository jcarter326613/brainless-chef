name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      image_tag:
        description: Tested development image Git SHA. Required for production.
        required: false
        type: string
      run_migrations:
        description: Initialize a new database before its first service deployment.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment || 'development' }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: brainlesschef
  GCP_REGION: us-east1
  IMAGE_REPOSITORY: us-east1-docker.pkg.dev/brainlesschef/brainless-chef

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'development' }}
      REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
      TF_VAR_api_invoker_members: ${{ vars.API_INVOKER_MEMBERS || '[]' }}
    steps:
      - id: image
        name: Select release image
        run: |
          if [[ "${DEPLOYMENT_ENVIRONMENT}" == "production" ]]; then
            if [[ ! "${REQUESTED_IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Production deployments require image_tag to be a full, tested Git SHA." >&2
              exit 1
            fi
            echo "tag=${REQUESTED_IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.image.outputs.tag }}
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Verify worker bootstrap
        run: |
          gcloud iam service-accounts describe "brainless-${DEPLOYMENT_ENVIRONMENT}-worker@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --project "${GCP_PROJECT_ID}" \
            --quiet
      - name: Build and publish development containers
        if: env.DEPLOYMENT_ENVIRONMENT == 'development'
        run: |
          build_if_missing() {
            component="$1"
            dockerfile="$2"
            image="${IMAGE_REPOSITORY}/development/${component}:${{ steps.image.outputs.tag }}"

            if docker pull "${image}"; then
              echo "Using existing SHA-tagged ${component} image."
              return
            fi

            docker build --file "${dockerfile}" --tag "${image}" .
            docker push "${image}"
          }

          build_if_missing api apps/api/Dockerfile
          build_if_missing web apps/web/Dockerfile
          build_if_missing worker apps/worker/Dockerfile
      - name: Promote tested development containers
        if: env.DEPLOYMENT_ENVIRONMENT == 'production'
        run: |
          promote_if_missing() {
            component="$1"
            production_image="${IMAGE_REPOSITORY}/production/${component}:${{ steps.image.outputs.tag }}"

            if docker pull "${production_image}"; then
              echo "Using retained production ${component} image."
              return
            fi

            development_image="${IMAGE_REPOSITORY}/development/${component}:${{ steps.image.outputs.tag }}"
            docker pull "${development_image}"
            docker tag "${development_image}" "${production_image}"
            docker push "${production_image}"
          }

          promote_if_missing api
          promote_if_missing web
          promote_if_missing worker
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Ensure Firestore database exists
        working-directory: infrastructure/environments/${{ inputs.environment || 'development' }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -target=google_firestore_database.database
      - name: Run database migrations
        if: inputs.run_migrations == true
        env:
          RELEASE_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          if [[ "${DEPLOYMENT_ENVIRONMENT}" == "production" ]]; then
            FIRESTORE_DATABASE_ID="(default)"
          else
            FIRESTORE_DATABASE_ID="development"
          fi

          MIGRATION_JOB="brainless-chef-${DEPLOYMENT_ENVIRONMENT}-migrate"
          MIGRATION_SERVICE_ACCOUNT="brainless-${DEPLOYMENT_ENVIRONMENT}-migrator@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          API_IMAGE="${IMAGE_REPOSITORY}/${DEPLOYMENT_ENVIRONMENT}/api:${RELEASE_IMAGE_TAG}"

          gcloud run jobs deploy "${MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${API_IMAGE}" \
            --service-account "${MIGRATION_SERVICE_ACCOUNT}" \
            --set-env-vars "FIRESTORE_DATABASE_ID=${FIRESTORE_DATABASE_ID}" \
            --command node \
            --args dist/migrate.js \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 3600s \
            --quiet
          gcloud run jobs execute "${MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --wait
      - name: Apply Terraform
        working-directory: infrastructure/environments/${{ inputs.environment || 'development' }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var="api_image=${IMAGE_REPOSITORY}/${DEPLOYMENT_ENVIRONMENT}/api:${{ steps.image.outputs.tag }}" \
            -var="web_image=${IMAGE_REPOSITORY}/${DEPLOYMENT_ENVIRONMENT}/web:${{ steps.image.outputs.tag }}" \
            -var="worker_image=${IMAGE_REPOSITORY}/${DEPLOYMENT_ENVIRONMENT}/worker:${{ steps.image.outputs.tag }}"
