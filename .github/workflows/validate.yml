name: Validate

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive infrastructure
      - run: terraform -chdir=infrastructure/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infrastructure/bootstrap validate
      - run: terraform -chdir=infrastructure/environments/development init -backend=false -input=false
      - run: terraform -chdir=infrastructure/environments/development validate
      - run: terraform -chdir=infrastructure/environments/production init -backend=false -input=false
      - run: terraform -chdir=infrastructure/environments/production validate
